<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graham Bot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#050510;
color:white;
}

/* pages */
.page{
display:none;
padding:40px 20px;
}

.active{
display:block;
}

/* header */
header{
text-align:center;
padding:20px;
background:rgba(255,255,255,0.05);
}

/* hero */
.hero{
text-align:center;
padding:70px 20px;
}

h1{
font-size:50px;
background:linear-gradient(90deg,#00c3ff,#b700ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* buttons */
.btn{
display:inline-block;
margin:10px;
padding:12px 25px;
border-radius:12px;
text-decoration:none;
color:white;
cursor:pointer;
border:none;
}

.blue{background:#008cff;}
.purple{background:#7b2cff;}

/* box */
.box{
margin:20px auto;
max-width:400px;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
}

input,textarea{
width:100%;
margin:8px 0;
padding:10px;
border:none;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
border-radius:8px;
}

/* features */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:30px;
}

.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
}

/* nav */
.nav{
text-align:center;
margin-top:20px;
}

/* price */
.price{
font-size:25px;
color:#00c3ff;
margin:10px 0;
}
</style>
</head>

<body>

<header>
<h2>Graham Platform</h2>
</header>

<!-- HOME -->
<section id="home" class="page active">

<div class="hero">

<h1>GRAHAM BOT</h1>

<a class="btn blue" href="https://rubika.ir/GrahamBot" target="_blank">
ورود به Graham Bot
</a>

<a class="btn purple" href="https://rubika.ir/Bomber10Bot" target="_blank">
ورود به Bomber Bot
</a>

</div>

<div class="nav">

<button class="btn blue" onclick="showPage('ads')">
📢 تبلیغ ربات
</button>

</div>

</section>

<!-- ADS -->
<section id="ads" class="page">

<div class="hero">

<h1>تبلیغ ربات</h1>

<p class="price">💰 20,000 تومان</p>

<div class="box">

<input placeholder="اسم ربات">
<input placeholder="لینک ربات">
<textarea placeholder="توضیحات ربات"></textarea>

<a class="btn blue" href="https://rubika.ir/admin10blue" target="_blank">
📩 ارسال درخواست در روبیکا
</a>

</div>

</div>

<!-- FEATURES UNDER ADS -->
<div class="cards">

<div class="card">✔ مدیریت گروه حرفه‌ای</div>
<div class="card">✔ ضد لینک و اسپم</div>
<div class="card">✔ ابزارهای هوشمند</div>
<div class="card">✔ امنیت بالا</div>

</div>

<div class="nav">

<button class="btn purple" onclick="showPage('home')">
⬅ برگشت به صفحه اصلی
</button>

</div>

</section>

<script>
function showPage(page){
document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});
document.getElementById(page).classList.add('active');
}
</script>

</body>
</html>
