<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graham Bot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#050510;
color:white;
}

/* header */
header{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

/* buttons */
.btn{
display:inline-block;
margin:10px;
padding:12px 25px;
border-radius:12px;
text-decoration:none;
color:white;
transition:.3s;
}

.btn:hover{transform:scale(1.05);}
.blue{background:#008cff;}
.purple{background:#7b2cff;}

/* hero */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:50px;
background:linear-gradient(90deg,#00c3ff,#b700ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* chat box */
.chatBox{
display:flex;
height:380px;
margin:20px;
border:1px solid rgba(255,255,255,0.1);
border-radius:15px;
overflow:hidden;
}

/* chat */
#chat{
flex:1;
padding:10px;
overflow:auto;
}

.msg{
margin:8px 0;
padding:8px;
border-radius:10px;
max-width:75%;
}

.user{background:#008cff;margin-left:auto;}
.ai{background:#7b2cff;}

/* sidebar */
.sidebar{
width:220px;
background:rgba(255,255,255,0.05);
padding:10px;
border-left:1px solid rgba(255,255,255,0.1);
}

.sidebar h3{
color:#00c3ff;
font-size:14px;
}

.sidebar li{
font-size:12px;
margin:6px 0;
padding:6px;
background:rgba(255,255,255,0.08);
border-radius:6px;
}

/* input */
.inputBox{
display:flex;
margin-top:10px;
}

input{
flex:1;
padding:8px;
border:none;
outline:none;
background:transparent;
color:white;
min-width:0;
}

button{
padding:8px 12px;
border:none;
background:#00c3ff;
cursor:pointer;
}

/* admin */
.admin{
text-align:center;
padding:80px 20px;
border-top:1px solid rgba(255,255,255,0.1);
}

footer{
text-align:center;
padding:40px;
color:#aaa;
}
</style>
</head>

<body>

<header>
<h3>Graham Bot</h3>
</header>

<!-- HERO -->
<section class="hero">
<h1>GRAHAM BOT</h1>

<a class="btn blue" href="https://rubika.ir/GrahamBot" target="_blank">ورود به Bot</a>
<a class="btn purple" href="https://rubika.ir/Bomber10Bot" target="_blank">Bomber Bot</a>
</section>

<!-- CHAT -->
<div class="chatBox">

<!-- chat -->
<div id="chat"></div>

<!-- sidebar -->
<div class="sidebar">

<h3>💡 چی بپرسی؟</h3>
<ul>
<li>سلام</li>
<li>خوبی</li>
<li>اسمت چیه</li>
<li>کمک</li>
<li>سایت</li>
</ul>

<div class="inputBox">
<input id="msg" placeholder="پیام...">
<button onclick="send()">➤</button>
</div>

</div>

</div>

<!-- ADMIN -->
<section class="admin">
<h2>👑 مدیریت</h2>
<p>@admin10blue</p>

<a class="btn blue" href="https://rubika.ir/admin10blue" target="_blank">ادمین</a>
<a class="btn purple" href="https://rubika.ir/GrahamBot" target="_blank">بات</a>
</section>

<footer>
© 2026 Graham Bot
</footer>

<script>

function send(){
let input=document.getElementById("msg");
let text=input.value.trim();
if(!text) return;

add(text,"user");

setTimeout(()=>{
add(reply(text),"ai");
},300);

input.value="";
}

function add(text,type){
let chat=document.getElementById("chat");
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

/* 🧠 smart replies */
function reply(t){
t=t.toLowerCase();

if(t.includes("سلام")) return "سلام 👋 خوش اومدی";
if(t.includes("خوبی")) return "خوبم 😎 تو چطوری؟";
if(t.includes("اسمت")) return "من Graham AI هستم 🤖";
if(t.includes("کمک")) return "هر سوالی داری بپرس 💡";
if(t.includes("سایت")) return "این سایت برای ربات Graham ساخته شده 🚀";

return "جالب گفتی 😎";
}

</script>

</body>
</html>
