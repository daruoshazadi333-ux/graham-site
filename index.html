<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graham Platform</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#050510;
color:white;
}

/* pages */
.page{
display:none;
padding:20px;
min-height:100vh;
}

.page.active{
display:block;
}

/* header */
header{
text-align:center;
padding:15px;
background:rgba(255,255,255,0.05);
}

/* hero */
.hero{
text-align:center;
padding:50px 10px;
}

h1{
font-size:40px;
background:linear-gradient(90deg,#00c3ff,#b700ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* buttons */
.btn{
display:block;
width:90%;
max-width:300px;
margin:10px auto;
padding:12px;
border-radius:12px;
border:none;
text-align:center;
color:white;
cursor:pointer;
text-decoration:none;
font-size:16px;
}

.blue{background:#008cff;}
.purple{background:#7b2cff;}
.red{background:#ff4d4d;}

/* box */
.box{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
margin:20px auto;
max-width:400px;
}

input,textarea{
width:100%;
margin:8px 0;
padding:10px;
border:none;
outline:none;
border-radius:8px;
background:rgba(255,255,255,0.08);
color:white;
}

/* features */
.features{
display:grid;
grid-template-columns:1fr;
gap:10px;
margin-top:20px;
}

.feature{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:10px;
text-align:center;
}

/* list */
.listItem{
background:rgba(255,255,255,0.08);
padding:10px;
margin:8px 0;
border-radius:10px;
font-size:13px;
}
</style>
</head>

<body>

<header>
<h3>Graham Platform</h3>
</header>

<!-- HOME -->
<div id="home" class="page active">

<div class="hero">
<h1>GRAHAM BOT</h1>

<a class="btn blue" href="https://rubika.ir/GrahamBot" target="_blank">ورود به Graham Bot</a>
<a class="btn purple" href="https://rubika.ir/Bomber10Bot" target="_blank">ورود به Bomber Bot</a>

</div>

<button class="btn blue" onclick="go('ads')">📢 تبلیغ ربات</button>
<button class="btn red" onclick="go('admin')">🛠 پنل مدیریت</button>

</div>

<!-- ADS -->
<div id="ads" class="page">

<h2 style="text-align:center;">تبلیغ ربات</h2>
<p style="text-align:center;color:#00c3ff;">💰 20,000 تومان</p>

<div class="box">

<input id="name" placeholder="اسم ربات">
<input id="link" placeholder="لینک ربات">
<textarea id="desc" placeholder="توضیح"></textarea>

<button class="btn blue" onclick="saveAd()">ثبت تبلیغ</button>

</div>

<div class="features">

<div class="feature">✔ نمایش در سایت</div>
<div class="feature">✔ دیده شدن کاربران</div>
<div class="feature">✔ افزایش عضو</div>
<div class="feature">✔ تبلیغ حرفه‌ای</div>

</div>

<button class="btn purple" onclick="go('home')">⬅ برگشت</button>

</div>

<!-- ADMIN -->
<div id="admin" class="page">

<h2 style="text-align:center;">پنل مدیریت</h2>

<div class="box">
<div id="list"></div>
</div>

<button class="btn purple" onclick="go('home')">⬅ برگشت</button>

</div>

<script>

/* page switch FIXED for mobile */
function go(page){

document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});

document.getElementById(page).classList.add('active');

}

/* save ads */
function saveAd(){

let n=document.getElementById("name").value;
let l=document.getElementById("link").value;
let d=document.getElementById("desc").value;

if(!n || !l){
alert("اسم و لینک الزامی است");
return;
}

let data=JSON.parse(localStorage.getItem("ads")||"[]");

data.push({n,l,d});

localStorage.setItem("ads",JSON.stringify(data));

document.getElementById("name").value="";
document.getElementById("link").value="";
document.getElementById("desc").value="";

load();

alert("ثبت شد ✅");

}

/* load admin */
function load(){

let list=document.getElementById("list");
let data=JSON.parse(localStorage.getItem("ads")||"[]");

list.innerHTML="";

data.forEach(a=>{
list.innerHTML+=
<div class="listItem">
<b>${a.n}</b><br>
${a.d}<br>
<a href="${a.l}" target="_blank" style="color:#00c3ff;">لینک</a>
</div>
;
});

}

load();

</script>

</body>
</html>
