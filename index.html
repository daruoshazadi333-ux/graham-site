<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graham Support</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#0b0f2a;
    color:white;
}

/* header */
header{
    text-align:center;
    padding:40px;
}

/* chat */
#support{
    position:fixed;
    bottom:20px;
    right:20px;
    width:280px;
    background:#111;
    border:1px solid #00ffcc;
    border-radius:12px;
    overflow:hidden;
}

#title{
    background:#00ffcc;
    color:black;
    padding:8px;
    font-weight:bold;
    text-align:center;
}

#chat{
    height:200px;
    overflow:auto;
    padding:10px;
}

.msg{
    background:rgba(255,255,255,0.1);
    margin:5px 0;
    padding:6px;
    border-radius:8px;
}

/* input */
#inputBox{
    display:flex;
    border-top:1px solid #333;
}

#inputBox input{
    flex:1;
    padding:8px;
    border:none;
    background:transparent;
    color:white;
}

#inputBox button{
    background:#00ffcc;
    border:none;
    padding:8px;
    cursor:pointer;
}

/* admin */
#admin{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
    flex-direction:column;
    padding:20px;
}

.panel{
    max-width:500px;
    margin:auto;
    background:#111;
    padding:20px;
    border-radius:12px;
    border:1px solid #00ffcc;
}

.msgBox{
    background:rgba(0,255,204,0.1);
    padding:8px;
    margin:5px 0;
    border-radius:8px;
}

button{
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>🤖 Graham Support</h1>
    <button onclick="openAdmin()">ورود ادمین</button>
</header>

<!-- 💬 user chat -->
<div id="support">
    <div id="title">💬 پشتیبانی</div>

    <div id="chat"></div>

    <div id="inputBox">
        <input id="txt" placeholder="پیام..." />
        <button onclick="send()">➤</button>
    </div>
</div>

<!-- 🛠️ admin panel -->
<div id="admin">
    <div class="panel">

        <h2>🛠️ پنل ادمین</h2>

        <input id="pass" type="password" placeholder="رمز..." />
        <button onclick="login()">ورود</button>

        <hr>

        <div id="list"></div>

        <button onclick="closeAdmin()">بستن</button>
    </div>
</div>

<script>

let msgs = JSON.parse(localStorage.getItem("msgs") || "[]");

/* نمایش چت کاربر */
function render(){
    let chat = document.getElementById("chat");
    chat.innerHTML = "";

    msgs.forEach(m=>{
        let d = document.createElement("div");
        d.className="msg";
        d.innerText="👤 "+m;
        chat.appendChild(d);
    });

    chat.scrollTop = chat.scrollHeight;
}
render();

/* ارسال پیام */
function send(){
    let t = document.getElementById("txt");
    if(t.value.trim()=="") return;

    msgs.push(t.value);
    localStorage.setItem("msgs", JSON.stringify(msgs));

    t.value="";
    render();
}

/* admin */
function openAdmin(){
    document.getElementById("admin").style.display="flex";
}

function closeAdmin(){
    document.getElementById("admin").style.display="none";
}

function login(){
    let p = document.getElementById("pass").value;

    if(p === "Armin92abedi920"){
        show();
    } else {
        alert("❌ رمز اشتباه");
    }
}

function show(){
    let list = document.getElementById("list");
    list.innerHTML="";

    msgs.forEach((m,i)=>{
        let d = document.createElement("div");
        d.className="msgBox";
        d.innerHTML = (i+1)+". "+m+
         <button onclick="del(${i})">حذف</button>;
        list.appendChild(d);
    });
}

/* حذف پیام */
function del(i){
    msgs.splice(i,1);
    localStorage.setItem("msgs", JSON.stringify(msgs));
    show();
    render();
}

</script>

</body>
</html>
