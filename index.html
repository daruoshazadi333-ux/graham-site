<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graham Platform</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#050510;
color:white;
overflow-x:hidden;
}

/* pages animation */
.page{
display:none;
opacity:0;
transform:translateY(15px);
transition:0.4s;
padding:40px 20px;
}

.active{
display:block;
opacity:1;
transform:translateY(0);
}

/* header */
header{
text-align:center;
padding:20px;
background:rgba(255,255,255,0.05);
}

/* hero */
.hero{
text-align:center;
padding:70px 20px;
}

h1{
font-size:50px;
background:linear-gradient(90deg,#00c3ff,#b700ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* buttons */
.btn{
display:inline-block;
margin:10px;
padding:12px 25px;
border-radius:12px;
border:none;
cursor:pointer;
text-decoration:none;
color:white;
transition:0.3s;
}

.btn:hover{transform:scale(1.08);}
.blue{background:#008cff;}
.purple{background:#7b2cff;}
.red{background:#ff4d4d;}

/* form */
.box{
margin:20px auto;
max-width:420px;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
}

input,textarea{
width:100%;
margin:8px 0;
padding:10px;
border:none;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
border-radius:8px;
}

/* features */
.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:40px;
}

.feature{
background:rgba(255,255,255,0.06);
padding:20px;
border-radius:15px;
text-align:center;
}

/* admin panel */
.adminBox{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
max-width:500px;
margin:20px auto;
}

.listItem{
background:rgba(255,255,255,0.08);
padding:10px;
margin:8px 0;
border-radius:8px;
font-size:13px;
}

/* nav */
.nav{
text-align:center;
margin-top:25px;
}

/* price */
.price{
font-size:25px;
color:#00c3ff;
margin:10px 0;
}
</style>
</head>

<body>

<header>
<h2>Graham Platform</h2>
</header>

<!-- HOME -->
<section id="home" class="page active">

<div class="hero">

<h1>GRAHAM BOT</h1>

<a class="btn blue" href="https://rubika.ir/GrahamBot" target="_blank">
ورود به Graham Bot
</a>

<a class="btn purple" href="https://rubika.ir/Bomber10Bot" target="_blank">
ورود به Bomber Bot
</a>

</div>

<div class="nav">

<button class="btn blue" onclick="showPage('ads')">
📢 تبلیغ ربات
</button>

<button class="btn red" onclick="showPage('admin')">
🛠 پنل مدیریت
</button>

</div>

</section>

<!-- ADS -->
<section id="ads" class="page">

<div class="hero">

<h1>تبلیغ ربات</h1>

<p class="price">💰 20,000 تومان</p>

<div class="box">

<input id="botName" placeholder="اسم ربات">
<input id="botLink" placeholder="لینک ربات">
<textarea id="botDesc" placeholder="توضیحات"></textarea>

<button class="btn blue" onclick="addAd()">
📩 ثبت تبلیغ
</button>

</div>

</div>

<div class="features">

<div class="feature">✔ نمایش در سایت</div>
<div class="feature">✔ دیده شدن کاربران</div>
<div class="feature">✔ افزایش عضو</div>
<div class="feature">✔ تبلیغ حرفه‌ای</div>

</div>

<div class="nav">

<button class="btn purple" onclick="showPage('home')">
⬅ برگشت
</button>

</div>

</section>

<!-- ADMIN -->
<section id="admin" class="page">

<div class="hero">
<h1>پنل مدیریت</h1>
</div>

<div class="adminBox">

<h3>📢 تبلیغات ثبت شده</h3>

<div id="list"></div>

</div>

<div class="nav">

<button class="btn purple" onclick="showPage('home')">
⬅ برگشت
</button>

</div>

</section>

<script>

/* pages */
function showPage(page){

document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});

setTimeout(()=>{
document.getElementById(page).classList.add('active');
},100);

}

/* ads storage */
function addAd(){

let name=document.getElementById("botName").value;
let link=document.getElementById("botLink").value;
let desc=document.getElementById("botDesc").value;

if(!name || !link) return;

let ads=JSON.parse(localStorage.getItem("ads")||"[]");

ads.push({name,link,desc});

localStorage.setItem("ads",JSON.stringify(ads));document.getElementById("botName").value="";
document.getElementById("botLink").value="";
document.getElementById("botDesc").value="";

loadAds();

alert("تبلیغ ثبت شد ✅");

}

/* load admin list */
function loadAds(){

let list=document.getElementById("list");
if(!list) return;

let ads=JSON.parse(localStorage.getItem("ads")||"[]");

list.innerHTML="";

ads.forEach((a,i)=>{

list.innerHTML+=
<div class="listItem">
<b>${a.name}</b><br>
${a.desc}<br>
<a href="${a.link}" target="_blank" style="color:#00c3ff;">لینک</a>
</div>
;

});

}

loadAds();

</script>

</body>
</html>
